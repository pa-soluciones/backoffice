# Servicios para desarrollo local. En producción: Neon (Postgres) y Cloud Run (Gotenberg).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pas
      POSTGRES_PASSWORD: pas
      POSTGRES_DB: pas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  gotenberg:
    build: ./gotenberg
    ports:
      - "3001:3000"

  # Sustituto local de Cloudflare R2 (API S3; no valida firmas). Crea el bucket al iniciar.
  r2:
    image: adobe/s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: pas-backoffice
    ports:
      - "9000:9090"

volumes:
  pgdata:
